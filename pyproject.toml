[tool.poetry]
name = "edmsuite"
version = "0.1.0"
description = "Python stuff for EDMSuite"
authors = ["cafmot <cafmot@ic.ac.uk>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
spcm = "^1.13.3"
nidaqmx = "^1.4.1"
