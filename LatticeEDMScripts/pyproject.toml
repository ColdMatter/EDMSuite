[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ybf"
version = "0.1.0"
description = "YbF molecular structure: constants, energy levels, transitions and stick spectra"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[tool.setuptools]
# Flat layout on purpose: this folder is already on sys.path in every existing
# analysis script, so `import ybf` works with no edits to those scripts.
packages = ["ybf"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
markers = ["slow: needs the legacy library's heavy imports (tkinter, seaborn)"]
